<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
    .pseudo{
        height: 30px;
        width:70px;
        background-color: antiquewhite;
        border-radius: 20px;
    }
    .pseudo:hover{
        height: 40px;
        width:80px;
        background-color: aquamarine;
    }
    .pseudo:active{
         height: 40px;
        width:80px;
        background-color: red;
    }
    </style>
</head>
<body>
    <button class="pseudo">click me</button>
</body>
</html>
