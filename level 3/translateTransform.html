<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>translate transform</title>
    <style>
        .rotate{
            height: 70px;
            width: 70px;
            border-radius: 10px;
            background-color: darkcyan;
            text-align: center;
            position: relative;
            top: 50px;
            left: 50px;
           
        }
        .rotate:hover{
             height: 70px;
            width: 70px;
            border-radius: 10px;
            background-color: darkcyan;
            text-align: center;
            position: relative;
            top: 50px;
            left: 50px;
            
            transform: translatey(900px);
             



        transition-property: all;
        transition-duration: 7s;
        transition-timing-function: ease-in-out;
        transition-delay: 0s;
        margin: 5px;
        }
    </style>
</head>
<body>
    <div class="rotate">translate</div>
</body>
</html>
