<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float</title>
    <style>
        #container{
            height: 200px;
            width: 500px;
            background-color: blanchedalmond;
            border: 2px solid black;
            text-align: center;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: darksalmon;
            margin: 5px;
            float: right;
        }
    </style>
</head>
<body>
    <div id="container">
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    
    </div>
    
    
</body>
</html>
