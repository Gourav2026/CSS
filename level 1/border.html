<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border</title>

    <style>
        *{margin: 0; padding: 0;}
        #button1 {
            height: 50px;
            width: 50px;
            border: 2px dotted black;
             border-radius: 1px 30px 1px 1px;
            margin: 5px;
            background-color: aquamarine;
        }
        #button2 {
            height: 50px;
            width: 50px;
            border: 2px solid black;
               border-radius: 10px;
            margin: 5px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>

    <button id="button1">click me</button><br>
    <button id="button2">click me</button>
    
</body>
</html>
