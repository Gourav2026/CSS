<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-transform</title>
    <style>
       
        #b1{text-transform: capitalize;}
        #b2{text-transform: uppercase;}
        #b3{text-transform: lowercase;}
        #b4{text-transform: none;}
        
    </style>




</head>
<body>
    <div id="b1" class="b">box 1</div><br>
    <div id="b2" class="b">box 2</div><br>
    <div id="b3" class="b">box 3</div><br>
    <div id="b4" class="b">box 4</div><br>
</body>
</html>
