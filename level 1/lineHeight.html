<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>line height</title>
    <style>
        #para1{
            line-height: 6px;
            font-size: 12px;
            font-style: italic;
        }
         #para2{
            line-height: 30px;
            font-weight: 900;
            font-style: oblique;
        }
    </style>

</head>
<body>
    <p id="para1">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Culpa quo quae blanditiis odit architecto quisquam dignissimos? Ad accusamus quasi id.
    </p>
   <p id="para2">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam natus consequuntur doloribus sequi ipsa quod atque facilis harum autem eveniet?
   </p>
</body>
</html>
