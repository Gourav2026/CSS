<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility</title>
    <style>
        .b{height: 40px; width: 40px;}
        #b1{background-color: red; visibility: visible;}
        #b2{background-color: green; visibility: hidden;}
        #b3{background-color: blue; visibility: visible;}
        #b4{background-color: yellowgreen; visibility: visible;}
        
    </style>




</head>
<body>
    <div id="b1" class="b">box 1</div><br>
    <div id="b2" class="b">box 2</div><br>
    <div id="b3" class="b">box 3</div><br>
    <div id="b4" class="b">box 4</div><br>
</body>
</html>
