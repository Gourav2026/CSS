<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background color</title>
    <style>

        *{
            margin: 0; padding: 0;
        }

     div{
        color: aquamarine;
        background-color: #ffffff;
     }

     .bgm{
        color: azure;
        background-color: #ff0000;
     }

     #bgm2{
        color: bisque;
        background-color: #00ff00;
     }
     
    </style>
</head>
<body>
    <div>gourav kumar</div>
    <div class="bgm">i am from jharkhand</div>
    <div id="bgm2">i am a college student</div>
    
</body>

</html>
