<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> text-align</title>
    <style>
        .b{height: 100px; width: 100px;}
        #b1{
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: blueviolet;
        }
        
        #b2{text-decoration: line-through;}
        #b3{text-decoration:overline;}
       
        
    </style>
</head>
<body>
    <div id="b1" class="b">box 1</div><br>
    <div id="b2" class="b">box 2</div><br>
    <div id="b3" class="b">box 3</div><br>

    <a href="#">link1</a><br>
    <a href="#" style="text-decoration: none;">link2</a>
   
</body>
</html>
