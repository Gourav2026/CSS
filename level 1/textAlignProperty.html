<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> text-align</title>
    <style>
        .b{height: 100px; width: 100px;}
        #b1{background-color: red;text-align: center;}
        #b2{background-color: green;text-align: left;}
        #b3{background-color: blue;text-align: right;}
       
        
    </style>




</head>
<body>
    <div id="b1" class="b">box 1</div><br>
    <div id="b2" class="b">box 2</div><br>
    <div id="b3" class="b">box 3</div><br>
   
</body>
</html>
